services:
  - type: web
    name: breastguard-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        fromDatabase:
          name: breastguard_db
          property: connectionString
      - key: DB_NAME
        value: breastguard_ai
